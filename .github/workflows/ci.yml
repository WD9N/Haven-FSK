# Cross-platform build + headless DSP self-tests (ROADMAP Phase 5:
# "cross-platform truth"). Machines verify what machines can: that the
# code compiles on Linux x86-64, Linux arm64 (Raspberry-Pi-class), and
# Windows, and that the DSP suite (FEC, Frame, MFSK loopback, PSK31)
# passes on each. Audio-device behavior still needs a human with
# hardware — see ROADMAP.md.
name: CI

on:
  push:
    branches: [cpp-rewrite, main]
  pull_request:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: linux-x64
            qt_host: linux
          - runner: ubuntu-24.04-arm
            name: linux-arm64
            qt_host: linux_arm64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.11
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          host: ${{ matrix.qt_host }}
          modules: 'qtmultimedia qtserialport qtwebsockets'
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libpulse-dev \
            libxkbcommon-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: DSP self-tests (headless)
        run: QT_QPA_PLATFORM=offscreen ./build/HavenFSK --self-test

  # Windows via MSYS2's packaged Qt6: download.qt.io's 6.11 Windows
  # layout is not yet supported by aqtinstall (issue #1007), and the
  # 6.11.1-exact parity build happens on the dev machine anyway — CI's
  # job is catching "doesn't compile on a clean Windows toolchain".
  windows:
    name: windows-x64 (MSYS2)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-serialport
            mingw-w64-x86_64-qt6-websockets

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: DSP self-tests (headless)
        run: QT_QPA_PLATFORM=offscreen ./build/HavenFSK.exe --self-test
